<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel de Temperaturas Semanais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Monitor de Temperaturas Semanais</h2>

  <label for="temperatura">Digite a temperatura (°C):</label><br>
  <input type="number" id="temperatura" step="0.1">
  <button onclick="adicionarTemperatura()">Adicionar Temperatura</button><br>

  <h3>Temperaturas Inseridas:</h3>
  <ul id="listaTemperaturas"></ul>

  <button onclick="calcularMedia()">Calcular Média</button>
  <button onclick="mediaMovel()">Média Móvel</button>

  <div id="resultado"></div>

  <script>
    const temperaturas = [];
    const temperaturasMediaMovel = [];

    function analisarTendencia() {
      const semana = temperaturas.slice(-7);

      let altas = 0;
      let quedas = 0;

      for (let i = 1; i < semana.length; i++) {
        if (semana[i] > semana[i - 1]) altas++;
        else if (semana[i] < semana[i - 1]) quedas++;
      }

      if (altas === 6) {
        alert("Tendência de aquecimento!");
      } else if (quedas === 6) {
        alert("Tendência de resfriamento!");
      } else {
        alert("Instabilidade: sem padrão claro.");
      }
    }

    function adicionarTemperatura() {
      const input = document.getElementById('temperatura');
      const valor = parseFloat(input.value);
      

      if (isNaN(valor)) {
        alert("Por favor, insira um número válido.");
        return;
      }

      temperaturas.push(valor);

      const lista = document.getElementById('listaTemperaturas');
      const item = document.createElement('li');
      item.textContent = valor + " °C";
      lista.appendChild(item);

      if (temperaturas.length >= 7) {
        analisarTendencia();
      }

      input.value = "";
      input.focus();
    }

    function mediaMovel() {
      if (temperaturas.length < 10) {
        alert("Temperaturas insuficientes inseridas.");
        return;
      }

      var aux = 0;
      for (let index = 0; index < temperaturas.length; index++) {
        
        aux += temperaturas[index];
        if (index % 3 == 0) {
          temperaturasMediaMovel.push(aux/3);
          aux = 0;
        }
      }

      const resultado = document.getElementById('resultado');
      resultado.innerHTML = `
        <p>Média Móvel (a cada 3 dias das) das temperaturas: <strong>${temperaturasMediaMovel.join(", ")} °C</strong></p>`;
    }

    function calcularMedia() {
      if (temperaturas.length === 0) {
        alert("Nenhuma temperatura foi inserida.");
        return;
      }

      media = temperaturas.reduce((total,temp) => total += temp,0)/temperaturas.length;
      let mensagem;

      if (media > 30) {
        mensagem = "A semana está quente! 🔥";
      } else if (media >= 20 && media <= 30) {
        mensagem = "Temperatura amena. 🌤️";
      } else {
        mensagem = "Semana fria! ❄️";
      }

      const resultado = document.getElementById('resultado');
      resultado.innerHTML = `
        <p>Média das temperaturas: <strong>${media.toFixed(2)} °C</strong></p>
        <div class="alerta">${mensagem}</div>
      `;
    }
  </script>

</body>
</html>
