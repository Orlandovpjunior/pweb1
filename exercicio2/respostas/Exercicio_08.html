<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="txt">Digite os números aqui
    <button onclick="resposta()">enviar</button>
    <p id="result"></p>
    <script>
        function resposta() {
            var numeros = document.getElementById("txt").value
                .split(",")
                .map(Number);
            var list = [];
            for (let index = 0; index < numeros.length; index++) {
                var fat = 1;
        
                for (let j = 2; j <= numeros[index]; j++) {
                    fat *= j;
                }
                list.push(fat);
            }

            document.getElementById('result').textContent = "Resultados: " + list.join(", ");
            
        }
    </script>
</body>
</html>
