<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styleTrocaProduto.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Carrinho de Compras</title>
</head>
<body>

    <header>
        <h1>Prova da Loja de Informática</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="compProdutos.html">Produtos</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="trocaProduto.html">marketeiro</a>
        </nav>
        <div class="carrinho">
            <span id="carrinho-contagem">0</span>
            <img src="./img/cart-icon.png" alt="Carrinho de Compras">
        </div>
    </header>

    <main>
        <section class="trocaProduto">
            <div class="container">
                <h1>Troca ou Devolução</h1>
                <form id="marketeiroForm">
                    <label for="pedido">Número do Pedido:</label>
                    <input type="number" id="pedido" name="pedido" required>

                    <label for="nome">Nome do Cliente:</label>
                    <input type="text" id="nome" name="nome" required>

                    <h3>Dados do Endereço</h3>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" onblur="consultaCep()" required>

                    <label for="logradouro">Logradouro:</label>
                    <input type="text" id="logradouro" name="logradouro" readonly>

                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento">

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" readonly>

                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado" readonly>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <h3>Solicitação</h3>

                    <label for="produto">Produto:</label>
                    <select id="produto" name="produto" required>
                        <option value="">Selecione...</option>
                        <option value="notebook">Notebook</option>
                        <option value="mouse">Mouse</option>
                        <option value="teclado">Teclado</option>
                        <option value="tablet">Tablet</option>
                        <option value="leitorBiometrico">Leitor Biométrico</option>
                        <option value="passadorSlide">Passador de Slide</option>
                    </select>

                    <label for="tipo">Tipo de Solicitação:</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecione...</option>
                        <option value="troca">Troca</option>
                        <option value="devolucao">Devolução</option>
                    </select>

                    <label for="motivo">Motivo da Solicitação:</label>
                    <textarea id="motivo" name="motivo" rows="4" required></textarea>

                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" name="quantidade" min="1" value="1" required>

                    <button type="submit" onclick="submeterDados()">Enviar</button>
                </form>
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 Minha Loja de Informática - Todos os direitos reservados</p>
    </footer>
    <script src="./scripts/script.js"></script>

</body>
</html>
