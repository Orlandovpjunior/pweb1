<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="css/styleCarrinho.css">
</head>
<body>
    <script src="scripts/script.js"></script>
    <header>
        <h1>Prova da Loja de Informática</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html">Produtos</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="#">Contato</a>
        </nav>
        <div class="carrinho">
            <span id="carrinho-contagem">0</span>
            <img src="img/cart-icon.png" alt="Carrinho de Compras">
        </div>
    </header>
    <main>
        <form>
            <h1>Forma de Envio</h1>
            <label for="fname">Digite seu CEP:</label><br>
            <input type="text" id="fname" name="fname" placeholder="CEP"><br>
            <button>Calcular Frete</button><br>
            <br><label for="lname"><a href="https://buscacepinter.correios.com.br/app/endereco/index.php">Não sei meu CEP</a></label><br>
            <h1>Cupom de Desconto</h1>
            <br><label for="">Digite seu Cupom:</label><br>
            <input type="text"><br>
            <button>Aplicar</button><br>
            <h1>Formas de Pagamento</h1>
            <label for="fname">Bandeira do cartão:</label><br>
            <select name="options" id="option-select">
            <option value="">Selecione uma opção-</option>
            <option value="dog">MasterCard</option>
            <option value="cat">Visa</option>

            <input type="text">
            <br><label for="">Digite seu Nome:</label><br>
            <input type="text">
            <br><label for="">Número do cartão:</label><br>
            <input type="text">
            <br><label for="">Data de validade do cartão:</label><br>
            <input type="text">
            <br><label for="">Código de segurança:</label><br>
            <input type="text">
            <button>Enviar</button><br>
        </form><form action="">

        </form>
        <section class="carrinho-itens">
            <h2>Seu Carrinho</h2>
            <div id="carrinho-container">
                <!-- Itens do carrinho serão exibidos aqui -->
            </div>
            <div class="carrinho-total">
                <h3>Total: <span id="carrinho-total">0,00</span></h3>
            </div>
            <button onclick="limpaCarrinho()">Limpar Carrinho</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Minha Loja de Informática - Todos os direitos reservados</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
